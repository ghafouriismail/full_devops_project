---
name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          pip install black yamllint bandit

      - name: Black
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.py')

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python files found — skipping Black"
            exit 0
          fi

          black --check "${files[@]}"

      - name: YAML lint
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.yml' '*.yaml')

          if [ ${#files[@]} -eq 0 ]; then
            echo "No YAML files found — skipping yamllint"
            exit 0
          fi

          yamllint "${files[@]}"

      - name: Bandit SAST
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.py')

          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python files found — skipping Bandit"
            exit 0
          fi

          bandit -ll "${files[@]}"
